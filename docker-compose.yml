services:
  postgres:
    image: postgres:16-alpine
    container_name: shopmind-postgres
    environment:
      POSTGRES_DB: shopmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopmind-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shopmind-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Shop.Api/Dockerfile
    container_name: shopmind-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=shopmind;Username=postgres;Password=postgres"
      Jwt__Secret: "shopmind-dev-secret-key-change-me-please-32chars!"
      Jwt__Issuer: "ShopMind"
      Jwt__Audience: "ShopMind"
      Mcp__Audience: "Shop.Mcp"
      Redis__ConnectionString: "redis:6379"
      Redis__Enabled: "true"
      Redis__DefaultTtlSeconds: "90"
      Idempotency__ConnectionString: "redis:6379"
      RateLimit__ConnectionString: "redis:6379"
      Ai__Provider: "${AI_PROVIDER:-opencode-go}"
      Ai__ApiKey: "${AI_API_KEY:-}"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: backend/Shop.Mcp/Dockerfile
    container_name: shopmind-mcp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=shopmind;Username=postgres;Password=postgres"
      Jwt__Secret: "shopmind-dev-secret-key-change-me-please-32chars!"
      Jwt__Issuer: "ShopMind"
      Jwt__Audience: "ShopMind"
      Mcp__Audience: "Shop.Mcp"
      Redis__ConnectionString: "redis:6379"
      Redis__Enabled: "true"
      Mcp__KeyPrefix: "shop:mcp:rl:"
      Idempotency__ConnectionString: "redis:6379"
      RateLimit__ConnectionString: "redis:6379"
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Shop.Worker/Dockerfile
    container_name: shopmind-worker
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=shopmind;Username=postgres;Password=postgres"
      RabbitMq__Url: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitdata:
